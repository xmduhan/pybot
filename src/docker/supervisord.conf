[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=Xvfb :0 -screen 0 %(ENV_DISPLAY_RESOLUTION)s
autostart=true
autorestart=true
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.log

[program:dbus]
command=dbus-daemon --system --nofork
autostart=true
autorestart=true
stdout_logfile=/var/log/dbus.log
stderr_logfile=/var/log/dbus.log

[program:xfce]
command=/bin/bash /opt/pybot/src/docker/startx.sh
autostart=true
autorestart=true
startsecs=60
stdout_logfile=/var/log/xfce.log
stderr_logfile=/var/log/xfce.log
environment=DISPLAY=:0

[program:x11vnc]
command=x11vnc -display :0 -forever -shared -nopw
autostart=true
autorestart=true
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.log

[program:noVNC]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
autostart=true
autorestart=true
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.log

[program:backend]
command=python3 manage.py runserver 0.0.0.0:8000
directory=/opt/pybot/src/backend
autostart=true
autorestart=true
stdout_logfile=/var/log/backend.log
stderr_logfile=/var/log/backend.log
environment=DISPLAY=:0

[program:frontend]
command=npm start
directory=/opt/pybot/src/frontend
autostart=true
autorestart=true
stdout_logfile=/var/log/frontend.log
stderr_logfile=/var/log/frontend.log
environment=DISPLAY=:0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx.log

[program:xauth]
command=/bin/bash /opt/pybot/src/docker/xauth.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/xauth.log
stderr_logfile=/var/log/xauth.log
environment=DISPLAY=:0

[program:ttyd]
command=ttyd -p 7681 ipython
autostart=true
autorestart=true
stdout_logfile=/var/log/ttyd.log
stderr_logfile=/var/log/ttyd.log
environment=DISPLAY=:0

[program:jupyterlab]
command=jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.token='' --ServerApp.password='' --ServerApp.allow_origin='*' --ServerApp.base_url=/jupyter/
autostart=true
autorestart=true
stdout_logfile=/var/log/jupyterlab.log
stderr_logfile=/var/log/jupyterlab.log
environment=DISPLAY=:0
